name: CICD-dev

on:
  push:
    branches: [dev]
  pull_request:
    branches: [dev]

# Cancel in-progress workflow runs if a new push arrives on the same branch
concurrency:
  group: dev-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ### FRONTEND CI ###
  ci-frontend:
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: frontend

    steps:
      # Checkout repository code into GitHub Actions runner
      - uses: actions/checkout@v4

      # Setup Node.js runtime with npm dependency caching for faster builds
      - uses: actions/setup-node@v6
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      # Install dependencies using npm ci for reproducible installs
      - name: Install dependencies
        run: npm ci

      # Audit frontend dependencies for known security vulnerabilities
      - name: Audit frontend dependencies
        run: npm audit --audit-level=high

      # Run frontend test suite (fail fast if tests fail)
      - name: Run frontend tests
        run: npm run test

      # Lint frontend source (catches style and type errors before build)
      - name: Lint frontend
        run: npm run lint

      # Build frontend assets with Vite
      - name: Build frontend
        run: npm run build
        env:
          VITE_BACKEND_URL: ${{ secrets.VITE_BACKEND_URL }}

  ### BACKEND CI ###
  ci-backend:
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: backend

    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      JWT_SECRET: ${{ secrets.JWT_SECRET }}

    steps:
      # Checkout repository code into GitHub Actions runner
      - uses: actions/checkout@v4

      # Setup Node.js runtime with npm dependency caching for faster builds
      - uses: actions/setup-node@v6
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: backend/package-lock.json

      # Install dependencies using npm ci for reproducible installs
      - name: Install dependencies
        run: npm ci

      # Audit backend dependencies for known security vulnerabilities
      - name: Audit backend dependencies
        run: npm audit --audit-level=high

      # Run backend test suite (fail fast if tests fail)
      - name: Run backend tests
        run: npm run test

      # Lint backend source
      - name: Lint backend
        run: npm run lint

      # Compile TypeScript backend to JavaScript
      - name: Build backend
        run: npm run build

  ### DATABASE MIGRATION CHECK ###
  db-check:
    runs-on: ubuntu-latest
    needs: [ci-backend]

    steps:
      # Checkout repository code into GitHub Actions runner
      - uses: actions/checkout@v4

      # Setup Node.js runtime with npm dependency caching for faster builds
      - uses: actions/setup-node@v6
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: backend/package-lock.json

      # Install dependencies using npm ci for reproducible installs
      - name: Install backend dependencies
        run: npm ci
        working-directory: backend

      # Validate database migrations can be generated without errors
      # NOTE: This only generates, does not apply migrations
      - name: Validate migrations (generate only)
        run: npx drizzle-kit generate
        working-directory: backend
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}

  ### DOCKER INTEGRATION CI ###
  # Full integration testing with Docker Compose
  # Depends on: ci-frontend and db-check (which depends on ci-backend)
  # All unit tests must pass before running integration tests
  ci-docker:
    runs-on: ubuntu-latest
    needs: [ci-frontend, db-check]

    env:
      DB_NAME: ${{ secrets.DB_NAME }}
      DB_USER: ${{ secrets.DB_USER }}
      DB_PASSWORD: ${{ secrets.DB_PASSWORD }}
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      JWT_SECRET: ${{ secrets.JWT_SECRET }}
      # Local development endpoints for testing from GitHub runner
      FRONTEND_URL: ${{ secrets.FRONTEND_URL }}
      VITE_BACKEND_URL: ${{ secrets.VITE_BACKEND_URL }}
      # Docker internal service name for container-to-container communication
      BACKEND_DOCKER_URL: ${{ secrets.BACKEND_DOCKER_URL }}
      # Database connection details for Docker container
      DB_HOST: ${{ secrets.DB_HOST }}
      DB_PORT: 5432

    steps:
      # Checkout repository code into GitHub Actions runner
      - uses: actions/checkout@v4

      # Start all services defined in docker-compose.dev.yml
      - name: Start docker compose
        run: docker compose -f docker-compose.dev.yml up -d --build

      # Wait for PostgreSQL container to be ready and accepting connections
      - name: Wait for PostgreSQL
        run: |
          max_attempts=10
          attempt=1
          until docker exec postgres pg_isready -U ${{ secrets.DB_USER }} || [ $attempt -ge $max_attempts ]; do
            echo "Waiting for postgres... ($attempt/$max_attempts)"
            sleep 5
            attempt=$((attempt + 1))
          done
          if [ $attempt -ge $max_attempts ]; then
            echo "Postgres failed to start!"
            docker compose logs postgres
            exit 1
          fi

      # Wait for backend service to become healthy (checks /health endpoint)
      - name: Wait for Backend
        run: |
          max_attempts=12
          attempt=1
          until curl --fail --silent ${{ secrets.VITE_BACKEND_URL }}/health || [ $attempt -ge $max_attempts ]; do
            echo "Waiting for backend... ($attempt/$max_attempts)"
            sleep 5
            attempt=$((attempt + 1))
          done
          if [ $attempt -ge $max_attempts ]; then
            echo "Backend failed to start!"
            docker compose logs backend
            exit 1
          fi

      # Wait for frontend development server to start and become responsive
      - name: Wait for Frontend
        run: |
          max_attempts=10
          attempt=1
          until curl --fail --silent ${{ secrets.FRONTEND_URL }} || [ $attempt -ge $max_attempts ]; do
            echo "Waiting for frontend... ($attempt/$max_attempts)"
            sleep 5
            attempt=$((attempt + 1))
          done
          if [ $attempt -ge $max_attempts ]; then
            echo "Frontend failed to start!"
            docker compose logs frontend
            exit 1
          fi

      # Integration test: verify frontend container can reach backend via Docker network
      - name: Test Frontend → Backend connectivity
        run: |
          docker exec frontend curl --fail ${{ secrets.BACKEND_DOCKER_URL }}/health
          echo "✓ Frontend can reach Backend"

      # Integration test: verify backend can connect to and query PostgreSQL database
      - name: Test Backend → Database connectivity
        run: |
          docker exec -e PGPASSWORD="${{ secrets.DB_PASSWORD }}" postgres \
            psql -U "${{ secrets.DB_USER }}" -d "${{ secrets.DB_NAME }}" -c "SELECT 1"
          echo "✓ Database connectivity verified"

      # Display container status for debugging (runs even if tests fail)
      - name: Docker status
        if: always()
        run: docker compose ps

      # Cleanup: stop all containers and remove volumes (always runs, even on failure)
      - name: Stop containers
        if: always()
        run: docker compose down
