name: CICD-dev

# At each push this workflow will run
on:
  push:
    branches:
      - dev
  # At each pull request to dev this workflow will run
  pull_request:
    branches:
      - dev

jobs:
  ### FRONT CI ###
  ci-frontend:
    # Job runs on the latest Ubuntu virtual machine
    runs-on: ubuntu-latest
    defaults:
      run:
        # Set working directory to frontend
        working-directory: frontend
    steps:
      # Clone repository onto GitHub VM
      - uses: actions/checkout@v4

      # Install Node.js version 20
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          # Enable NPM cache to speed up subsequent builds
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      # Install frontend dependencies
      - name: Frontend CI
        run: npm ci

      # Build frontend (generates dist folder)
      - run: npm run build

      # Run frontend tests
      - name: Frontend tests
        run: npm run test

  ### BACK CI ###
  ci-backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend

    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      JWT_SECRET: ${{ secrets.JWT_SECRET }}

    steps:
      # Clone repo
      - uses: actions/checkout@v4

      # Node.js setup
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: backend/package-lock.json

      # Install dependencies
      - name: Backend ci
        run: npm ci

      # Build backend
      - run: npm run build

      # Run backend tests
      - name: Backend tests
        run: npm run test

  ### DOCKER CI ###
  ci-docker:
    runs-on: ubuntu-latest
    needs: [ci-frontend, ci-backend]
    defaults:
      run:
        working-directory: .

    env:
      DB_NAME: ${{ secrets.DB_NAME }}
      DB_USER: ${{ secrets.DB_USER }}
      DB_PASSWORD: ${{ secrets.DB_PASSWORD }}
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      JWT_SECRET: ${{ secrets.JWT_SECRET }}
      FRONTEND_URL: ${{ secrets.FRONTEND_URL }}
      VITE_BACKEND_URL: ${{ secrets.VITE_BACKEND_URL }}
      NODE_ENV: "dev"

    steps:
      # Clone repo
      - uses: actions/checkout@v4

      # Check Docker version
      - name: Check Docker
        run: docker --version

      - name: Start docker compose
        # Inject GitHub env vars directly into shell
        # | is for multi-line script
        run: docker compose -f docker-compose.dev.yml up -d --build

      # Wait for Postgres to be ready
      - name: Wait for Postgres
        run: |
          max_attempts=10
          attempt=1
          until docker exec postgres pg_isready -U blablabook || [ $attempt -ge $max_attempts ]; do
            echo "Waiting for postgres..."
            sleep 5
            attempt=$((attempt + 1))
          done

          if [ $attempt -ge $max_attempts ]; then
            echo "Postgres failed to start in time!"
            exit 1
          fi

      # Wait for Frontend to be ready
      - name: Wait for Frontend
        run: |
          max_attempts=10
          attempt=1
          until curl -f "$FRONTEND_URL" || [ $attempt -ge $max_attempts ]; do
            echo "Waiting for frontend..."
            sleep 5
            attempt=$((attempt + 1))
          done
          if [ $attempt -ge $max_attempts ]; then
            echo "Frontend failed to start in time!"
            docker compose logs frontend
            exit 1
          fi
        env:
          FRONTEND_URL: ${{ secrets.FRONTEND_URL }}

      # Wait for Backend to be ready
      - name: Wait for Backend
        run: |
          max_attempts=10
          attempt=1
          until docker exec backend node -e "fetch('http://backend:3000/health').then(r => r.ok ? process.exit(0) : process.exit(1))" || [ $attempt -ge $max_attempts ]; do
            echo "Waiting for backend..."
            sleep 5
            attempt=$((attempt + 1))
          done
          if [ $attempt -ge $max_attempts ]; then
            echo "Backend failed to start in time!"
            docker compose logs backend
            exit 1
          fi

      # Verify backend works in container
      - name: Run backend tests in container
        run: docker exec backend npm run test

      # Integration test: Frontend -> Backend
      - name: Test Frontend to Backend connectivity
        run: |
          echo "Testing Frontend container calling Backend API..."
          # From frontend container, call backend API
          docker exec frontend node -e "fetch('http://backend:3000/health').then(r => r.ok ? process.exit(0) : process.exit(1))" || exit 1
          echo "✓ Frontend can reach Backend API"

      # Integration test: Backend -> Database
      - name: Test Backend to Database connectivity
        run: |
          echo "Testing Backend to Database queries..."
          # Verify that the database is accessible
          PGPASSWORD="$DB_PASSWORD" docker exec -e PGPASSWORD="$DB_PASSWORD" postgres psql -U "$DB_USER" -d "$DB_NAME" -c "SELECT 1" || exit 1
          echo "✓ Database connectivity verified"

      # Verify all containers are running
      - name: Docker status
        run: docker compose ps

      # Stop containers gracefully
      - name: Stop containers
        run: docker compose down
