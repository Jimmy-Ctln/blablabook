name: CICD-prod

# At each push this workflow will run
on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  ### FRONT CI ###
  ci-frontend:
    # Job runs on the latest Ubuntu virtual machine
    runs-on: ubuntu-latest
    defaults:
      run:
        # Set working directory to frontend
        working-directory: frontend
    steps:
      # Clone repository onto GitHub VM
      - uses: actions/checkout@v4

      # Install Node.js version 20
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          # Enable NPM cache to speed up subsequent builds
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      # Install frontend dependencies
      - name: Frontend CI
        run: npm ci

      # Build frontend with backend URL
      - name: Build frontend with backend URL
        run: |
          export VITE_BACKEND_URL=${{ secrets.VITE_BACKEND_URL }}
          npm run build

      # Run frontend tests
      - name: Frontend tests
        run: npm run test

      # Save built frontend for deployment
      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: frontend-build
          path: frontend/dist

  ### BACK CI ###
  ci-backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend

    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      JWT_SECRET: ${{ secrets.JWT_SECRET }}

    steps:
      # Clone repo
      - uses: actions/checkout@v4

      # Node.js setup
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: backend/package-lock.json

      # Install dependencies
      - name: Backend ci
        run: npm ci

      # Run backend tests
      - name: Backend tests
        run: npm run test

      # Apply migrations from git (developer creates migrations locally)
      - name: Apply database migrations
        run: npm run migrate
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}

      # Build backend
      - run: npm run build

      # Build Docker image
      - run: docker build -t blablabook-back .

  ### DOCKER CI ###
  ci-docker:
    runs-on: ubuntu-latest
    needs: [ci-frontend, ci-backend]
    defaults:
      run:
        working-directory: .
    # Make sure to add these variables to GitHub Secrets (settings > Secrets and variables > Secrets)
    env:
      DB_NAME: ${{ secrets.DB_NAME }}
      DB_USER: ${{ secrets.DB_USER }}
      DB_PASSWORD: ${{ secrets.DB_PASSWORD }}
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      JWT_SECRET: ${{ secrets.JWT_SECRET }}
      FRONTEND_URL_CORS: ${{ secrets.FRONTEND_URL_CORS }}
      VITE_BACKEND_URL: ${{ secrets.VITE_BACKEND_URL }}
      NODE_ENV: "production"

    steps:
      # Clone repo
      - uses: actions/checkout@v4

      # Check Docker version
      - name: Check Docker
        run: docker --version

      - name: Start docker compose
        # Inject GitHub env vars directly into shell
        # | is for multi-line script
        run: docker compose -f docker-compose.yml up -d --build

      # Wait for Postgres to be ready
      - name: Wait for Postgres
        run: |
          max_attempts=10
          attempt=1
          until docker exec postgres pg_isready -U blablabook || [ $attempt -ge $max_attempts ]; do
            echo "Waiting for postgres..."
            sleep 5
            attempt=$((attempt + 1))
          done

          if [ $attempt -ge $max_attempts ]; then
            echo "Postgres failed to start in time!"
            exit 1
          fi

      # Wait for Backend to be ready
      - name: Wait for Backend
        run: |
          max_attempts=10
          attempt=1
          until docker exec backend curl -f http://localhost:3000/health || [ $attempt -ge $max_attempts ]; do
            echo "Waiting for backend..."
            sleep 5
            attempt=$((attempt + 1))
          done
          if [ $attempt -ge $max_attempts ]; then
            echo "Backend failed to start in time!"
            docker compose logs backend
            exit 1
          fi

      # Verify backend works in container
      - name: Run backend tests in container
        run: docker exec backend npm run test

      # Integration test: Frontend -> Backend
      - name: Test Frontend to Backend connectivity
        run: |
          echo "Testing Frontend container calling Backend API..."
          # From frontend container, call backend API
          docker exec frontend curl -f http://backend:3000/health || exit 1
          echo "✓ Frontend can reach Backend API"

      # Integration test: Backend -> Database
      - name: Test Backend to Database connectivity
        run: |
          echo "Testing Backend to Database queries..."
          # Verify that the database is accessible
          PGPASSWORD="$DB_PASSWORD" docker exec -e PGPASSWORD="$DB_PASSWORD" postgres psql -U "$DB_USER" -d "$DB_NAME" -c "SELECT 1" || exit 1
          echo "✓ Database connectivity verified"

      # Verify all containers are running
      - name: Docker status
        run: docker compose ps

      # Stop containers gracefully
      - name: Stop containers
        run: docker compose down

  ### DEPLOY FRONTEND TO VERCEL ###
  deploy-frontend:
    needs: ci-docker
    runs-on: ubuntu-latest
    steps:
      - name: Trigger Vercel deployment via Deploy Hook
        run: |
          curl -X POST ${{ secrets.VERCEL_DEPLOY_HOOK }}
        env:
          WEBHOOK_URL: ${{ secrets.VERCEL_DEPLOY_HOOK }}

  ### DEPLOY BACKEND TO RENDER ###
  deploy-backend:
    needs: ci-docker
    runs-on: ubuntu-latest
    steps:
      - name: Trigger Render deployment via Deploy Hook
        run: |
          curl -X POST ${{ secrets.RENDER_DEPLOY_HOOK }}
