name: CICD-prod

on:
  push:
    branches: [main]

  pull_request:
    branches: [main]

concurrency:
  group: prod-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ### FRONTEND CI ###
  ci-frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        run: npm ci

      - name: Run frontend tests
        run: npm run test

      - name: Build frontend
        run: npm run build
        env:
          VITE_BACKEND_URL: ${{ secrets.VITE_BACKEND_URL }}

      - name: Upload frontend build artifact
        uses: actions/upload-artifact@v4
        with:
          name: frontend-build
          path: frontend/dist

  ### BACKEND CI ###
  ci-backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend

    env:
      JWT_SECRET: ${{ secrets.JWT_SECRET }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - name: Install backend dependencies
        run: npm ci

      - name: Run backend tests
        run: npm run test

      - name: Build backend
        run: npm run build

      - name: Build backend Docker image
        run: docker build -t blablabook-back .

  ### DOCKER INTEGRATION TESTS (DEBUG VERSION) ###
  ci-docker:
    runs-on: ubuntu-latest
    needs: [ci-frontend, ci-backend]

    env:
      DB_NAME: ${{ secrets.DB_NAME }}
      DB_USER: ${{ secrets.DB_USER }}
      DB_PASSWORD: ${{ secrets.DB_PASSWORD }}
      JWT_SECRET: ${{ secrets.JWT_SECRET }}

      FRONTEND_URL: ${{ secrets.FRONTEND_URL }}
      VITE_BACKEND_URL: ${{ secrets.VITE_BACKEND_URL }}
      BACKEND_DOCKER_URL: ${{ secrets.BACKEND_DOCKER_URL }}

      DB_HOST: postgres
      DB_PORT: 5432

      NODE_ENV: production

      DATABASE_URL: postgresql://${{ secrets.DB_USER }}:${{ secrets.DB_PASSWORD }}@postgres:5432/${{ secrets.DB_NAME }}

    steps:
      - uses: actions/checkout@v4

      - name: Start docker compose
        run: docker compose -f docker-compose.yml up -d --build

      # =========================
      # POSTGRES CHECK
      # =========================
      - name: Test database connection
        run: |
          docker exec postgres psql \
            -U "${{ secrets.DB_USER }}" \
            -d "${{ secrets.DB_NAME }}" \
            -c "SELECT 1"

          echo "✓ Database connection successful"

      # =========================
      # DOCKER DEBUG
      # =========================
      - name: Debug docker compose state
        run: |
          echo "=== DOCKER COMPOSE PS ==="
          docker compose ps

          echo "=== NETWORKS ==="
          docker network ls

      - name: Debug backend container
        run: docker inspect backend

      # =========================
      # DNS / NETWORK CHECK
      # =========================
      - name: Debug backend DNS resolution
        run: docker exec backend getent hosts postgres || true

      - name: Debug backend networking
        run: docker exec backend ping -c 5 postgres || true

      # =========================
      # ENV CHECK
      # =========================
      - name: Debug DATABASE_URL
        run: |
          docker exec \
            -e DATABASE_URL="postgresql://${{ secrets.DB_USER }}:${{ secrets.DB_PASSWORD }}@postgres:5432/${{ secrets.DB_NAME }}" \
            backend printenv DATABASE_URL

      # =========================
      # DRIZZLE CHECK
      # =========================
      - name: Verify drizzle-kit installation
        run: docker exec backend npx drizzle-kit --version

      # =========================
      # DB CLIENT TEST FROM BACKEND
      # =========================
      - name: Install postgres client in backend
        run: |
          docker exec backend sh -c "apk add --no-cache postgresql-client"

      - name: Test backend -> postgres connectivity
        run: |
          docker exec backend sh -c "
            PGPASSWORD='${{ secrets.DB_PASSWORD }}' \
            psql \
            -h postgres \
            -U '${{ secrets.DB_USER }}' \
            -d '${{ secrets.DB_NAME }}' \
            -c 'SELECT 1'
          "

      # =========================
      # LOGS BEFORE MIGRATION
      # =========================
      - name: Backend logs before migration
        run: docker logs backend || true

      # =========================
      # MIGRATIONS (DEBUG MODE)
      # =========================
      - name: Run local database migrations (DEBUG)
        run: |
          docker exec \
            -e DATABASE_URL="postgresql://${{ secrets.DB_USER }}:${{ secrets.DB_PASSWORD }}@postgres:5432/${{ secrets.DB_NAME }}" \
            -e DEBUG="drizzle:*" \
            backend sh -c "
              echo 'NODE VERSION:' && node -v
              echo 'NPM VERSION:' && npm -v

              echo 'FILES:' && ls -la

              echo 'DRIZZLE DIR:' && ls -la drizzle || true

              echo 'START MIGRATION'
              npm run migrate -- --verbose
            "

      # =========================
      # FINAL LOGS
      # =========================
      - name: PostgreSQL logs
        if: always()
        run: docker logs postgres || true

      - name: Backend logs after migration
        if: always()
        run: docker logs backend || true

      - name: Docker status
        if: always()
        run: docker compose ps

      - name: Stop containers
        if: always()
        run: docker compose down

        ### PRODUCTION DATABASE MIGRATIONS ###
  # Run database schema migrations on production database
  # IMPORTANT: Only executes after ALL tests and integration tests pass
  # This prevents applying schema changes with unvalidated code
  db-prod-migrations:
    runs-on: ubuntu-latest
    needs: [ci-docker]

    if: github.event_name == 'push'

    steps:
      # Checkout repository code into GitHub Actions runner
      - uses: actions/checkout@v4

      # Setup Node.js runtime with npm dependency caching
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: backend/package-lock.json

      # Install dependencies using npm ci for reproducible installs
      - name: Install backend dependencies
        run: npm ci
        working-directory: backend

      # Apply database schema migrations to production database
      # NOTE: All migrations must be backward-compatible
      - name: Run production database migrations
        run: npx drizzle-kit migrate
        working-directory: backend
        env:
          DATABASE_URL: ${{ secrets.PROD_DATABASE_URL }}

  ### DEPLOY BACKEND (RENDER) ###
  # Deploy backend service to Render
  # Only runs after production database migrations succeed
  deploy-backend:
    runs-on: ubuntu-latest
    needs: [db-prod-migrations]

    if: github.event_name == 'push'

    steps:
      # Trigger backend deployment via Render deployment hook
      - name: Trigger Render deployment
        run: |
          curl --fail -X POST ${{ secrets.RENDER_DEPLOY_HOOK }}

      # Wait for backend deployment to complete and become healthy
      # Validates that the service is responsive at the health endpoint
      - name: Wait for backend deployment
        run: |
          max_attempts=30
          attempt=1

          until curl --fail --silent ${{ secrets.PROD_BACKEND_URL }}/health || [ $attempt -ge $max_attempts ]; do
            echo "Waiting for backend deployment... ($attempt/$max_attempts)"
            sleep 10
            attempt=$((attempt + 1))
          done

          if [ $attempt -ge $max_attempts ]; then
            echo "Backend deployment failed!"
            exit 1
          fi

          echo "✓ Backend deployment successful"

  ### DEPLOY FRONTEND (VERCEL) ###
  # Deploy frontend application to Vercel
  # Only runs after backend deployment is confirmed healthy
  deploy-frontend:
    runs-on: ubuntu-latest
    needs: [deploy-backend]

    if: github.event_name == 'push'

    steps:
      # Trigger frontend deployment via Vercel deployment hook
      - name: Trigger Vercel deployment
        run: |
          curl --fail -X POST ${{ secrets.VERCEL_DEPLOY_HOOK }}

      # Wait for frontend deployment to complete and become publicly accessible
      # Validates that the production frontend URL is responding
      - name: Wait for frontend deployment
        run: |
          max_attempts=30
          attempt=1

          until curl --fail --silent ${{ secrets.PROD_FRONTEND_URL }} || [ $attempt -ge $max_attempts ]; do
            echo "Waiting for frontend deployment... ($attempt/$max_attempts)"
            sleep 10
            attempt=$((attempt + 1))
          done

          if [ $attempt -ge $max_attempts ]; then
            echo "Frontend deployment failed!"
            exit 1
          fi

          echo "✓ Frontend deployment successful"
