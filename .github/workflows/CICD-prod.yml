name: CICD-prod

on:
  push:
    branches: [main]

  pull_request:
    branches: [main]

concurrency:
  group: prod-${{ github.ref }}
  cancel-in-progress: false

jobs:
  ### FRONTEND CI ###
  ci-frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        run: npm ci

      - name: Audit frontend dependencies
        run: npm audit --audit-level=high

      - name: Run frontend tests
        run: npm run test

      - name: Lint frontend
        run: npm run lint

      - name: Build frontend
        run: npm run build
        env:
          VITE_BACKEND_URL: ${{ secrets.VITE_BACKEND_URL }}

  ### BACKEND CI ###
  ci-backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend

    env:
      JWT_SECRET: ${{ secrets.JWT_SECRET }}

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - name: Install backend dependencies
        run: npm ci

      - name: Audit backend dependencies
        run: npm audit --audit-level=high

      - name: Run backend tests
        run: npm run test

      - name: Lint backend
        run: npm run lint

      - name: Build backend
        run: npm run build

      - name: Build backend Docker image
        run: docker build -t blablabook-back .

  ### PRODUCTION DATABASE MIGRATIONS ###
  # Run database schema migrations on production database
  # IMPORTANT: Only executes after ALL tests and integration tests pass
  # This prevents applying schema changes with unvalidated code
  db-prod-migrations:
    runs-on: ubuntu-latest
    needs: [ci-frontend, ci-backend]

    if: github.event_name == 'push'

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - name: Install backend dependencies
        run: npm ci
        working-directory: backend

      - name: Test DB connection (prod)
        run: |
          node -e "console.log('DB:', process.env.DATABASE_URL ? 'OK' : 'MISSING')"
        env:
          DATABASE_URL: ${{ secrets.PROD_DATABASE_URL }}

      - name: Run migrations (Drizzle)
        run: npx drizzle-kit migrate
        working-directory: backend
        env:
          DATABASE_URL: ${{ secrets.PROD_DATABASE_URL }}

  ### DEPLOY BACKEND (RENDER) ###
  # Deploy backend service to Render
  # Only runs after production database migrations succeed
  deploy-backend:
    runs-on: ubuntu-latest
    needs: [db-prod-migrations]

    if: github.event_name == 'push'

    steps:
      # Trigger backend deployment via Render deployment hook
      - name: Trigger Render deployment
        run: |
          curl --fail -X POST ${{ secrets.RENDER_DEPLOY_HOOK }}

      # Wait for the NEW backend version to be live.
      # We compare the SHA returned by /health against the SHA that triggered
      # this workflow run. The old backend keeps responding during the swap,
      # so checking only HTTP 200 would give false positives.
      - name: Wait for backend deployment
        run: |
          max_attempts=30
          attempt=1
          expected_sha="${{ github.sha }}"

          while [ $attempt -le $max_attempts ]; do
            deployed_sha=$(curl --silent --max-time 10 ${{ secrets.PROD_BACKEND_URL }}/health | jq -r '.version // "unknown"')
            if [ "$deployed_sha" = "$expected_sha" ]; then
              echo "✓ Backend deployed at SHA $expected_sha"
              exit 0
            fi
            echo "Waiting for new backend version... ($attempt/$max_attempts) — expected $expected_sha, got $deployed_sha"
            sleep 10
            attempt=$((attempt + 1))
          done

          echo "Backend deployment failed: SHA never matched after $max_attempts attempts"
          exit 1

  ### DEPLOY FRONTEND (VERCEL) ###
  # Deploy frontend application to Vercel
  # Only runs after backend deployment is confirmed healthy
  deploy-frontend:
    runs-on: ubuntu-latest
    needs: [deploy-backend]

    if: github.event_name == 'push'

    steps:
      # Trigger frontend deployment via Vercel deployment hook
      - name: Trigger Vercel deployment
        run: |
          curl --fail -X POST ${{ secrets.VERCEL_DEPLOY_HOOK }}

      # Wait for the NEW frontend version to be live.
      # Vite writes the build-time VERCEL_GIT_COMMIT_SHA into /version.txt,
      # so we can compare it against the SHA that triggered this run.
      # Same reason as the backend: the old version keeps serving requests
      # during the swap, so checking only HTTP 200 would give false positives.
      - name: Wait for frontend deployment
        run: |
          max_attempts=30
          attempt=1
          expected_sha="${{ github.sha }}"

          while [ $attempt -le $max_attempts ]; do
            deployed_sha=$(curl --silent --max-time 10 ${{ secrets.PROD_FRONTEND_URL }}/version.txt || echo "unknown")
            if [ "$deployed_sha" = "$expected_sha" ]; then
              echo "✓ Frontend deployed at SHA $expected_sha"
              exit 0
            fi
            echo "Waiting for new frontend version... ($attempt/$max_attempts) — expected $expected_sha, got $deployed_sha"
            sleep 10
            attempt=$((attempt + 1))
          done

          echo "Frontend deployment failed: SHA never matched after $max_attempts attempts"
          exit 1
