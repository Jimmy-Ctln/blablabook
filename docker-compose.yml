services:
  # PostgreSQL service
  postgres:
    container_name: postgres
    image: postgres:16-alpine
    environment:
      # Database environment variables
      - POSTGRES_DB=${DB_NAME}
      - POSTGRES_USER=${DB_USER}
      - POSTGRES_PASSWORD=${DB_PASSWORD}
    volumes:
      # Persist database data
      - pgdata:/var/lib/postgresql/data
      # Initialize database with SQL script
      # - ../init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    ports:
      # Map host port 5433 to container 5432 for external access
      - "5433:5432"
    healthcheck:
      # Check if PostgreSQL is ready to accept connections
      test: ["CMD-SHELL", "pg_isready -U postgres -d ${DB_NAME}"]
      start_period: 15s
      interval: 15s
      timeout: 5s
      retries: 5

  # Backend service (NestJS + Drizzle ORM)
  backend:
    container_name: backend
    build:
      context: ./backend
      dockerfile: Dockerfile

    environment:
      - PGHOST=${DB_HOST}
      - PGUSER=${DB_USER}
      - PGDATABASE=${DB_NAME}
      - PGPASSWORD=${DB_PASSWORD}
      - PGPORT=${DB_PORT}
      - DATABASE_URL=${DATABASE_URL}
      - JWT_SECRET=${JWT_SECRET}
      - FRONTEND_URL=${FRONTEND_URL}
      - NODE_ENV=${NODE_ENV}

    ports:
      - "3000:3000"

    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000/health"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s

    depends_on:
      postgres:
        condition: service_healthy

  # Frontend service (React/Vite build)
  frontend:
    container_name: frontend
    build:
      context: ./frontend
      dockerfile: Dockerfile
    environment:
      - VITE_BACKEND_URL=${VITE_BACKEND_URL}
    ports:
      # Publish frontend port to host for direct browser access
      - "5173:5173"
    depends_on:
      # Ensure backend is healthy before starting frontend
      backend:
        condition: service_healthy

  adminer:
    image: adminer
    restart: unless-stopped
    ports:
      - "8080:8080"
    depends_on:
      - postgres

volumes:
  # Persistent volume for PostgreSQL data
  pgdata:
