services:
  postgres-test:
    image: postgres:16-alpine
    container_name: blablabook-postgres-test
    environment:
      POSTGRES_USER: test
      POSTGRES_PASSWORD: test
      POSTGRES_DB: blablabook_test
    ports:
      - "5434:5432"
    tmpfs:
      - /var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U test -d blablabook_test"]
      interval: 2s
      timeout: 3s
      retries: 10
