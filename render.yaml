services:
  - type: web
    name: blablabook-api
    runtime: node
    region: frankfurt
    plan: free
    buildCommand: cd backend && npm install && npm run build
    preStartCommand: cd backend && npm run migrate
    startCommand: cd backend && node dist/main.js
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 3000
      - key: DATABASE_URL
        fromDatabase:
          name: blablabook-postgres
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: FRONTEND_URL_CORS
        value: https://blablabook.vercel.app

  - type: pstg
    name: blablabook-postgres
    runtime: postgres15
    region: frankfurt
    plan: free
    databaseName: blablabook
    user: blablabook_user
    postgresMajorVersion: 15
