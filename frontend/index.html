<!doctype html>
<html lang="fr">
  <head>
    <!-- Prevent flash of wrong theme before React loads -->
    <script>
      (function () {
        try {
          var s = localStorage.getItem("theme_storage");
          if (s && JSON.parse(s).state.theme === "light")
            document.documentElement.classList.add("light");
        } catch (e) {}
      })();
    </script>
    <!-- Character encoding and viewport settings -->
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!-- SEO Meta Tags -->
    <meta
      name="description"
      content="Blablabook - Découvrez et partagez vos lectures favoris. Gérez votre bibliothèque personnelle, explorez les meilleures ventes et connectez-vous avec d'autres lecteurs."
    />
    <meta name="theme-color" content="#ffffff" />
    <meta name="application-name" content="Blablabook" />

    <!-- Open Graph Meta Tags for Social Media -->
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://blablabook-sigma.vercel.app" />
    <meta
      property="og:title"
      content="Blablabook - Votre bibliothèque numérique"
    />
    <meta
      property="og:description"
      content="Découvrez et partagez vos lectures favoris. Gérez votre bibliothèque personnelle et explorez les meilleures sélections."
    />
    <!-- og:image : remplacer /book.svg par une image PNG/JPG 1200×630 pour un meilleur rendu social -->
    <meta
      property="og:image"
      content="https://blablabook-sigma.vercel.app/book.svg"
    />

    <!-- Twitter Meta Tags for Social Media -->
    <meta property="twitter:card" content="summary" />
    <meta
      property="twitter:url"
      content="https://blablabook-sigma.vercel.app"
    />
    <meta
      property="twitter:title"
      content="Blablabook - Votre bibliothèque numérique"
    />
    <meta
      property="twitter:description"
      content="Découvrez et partagez vos lectures favoris."
    />
    <meta
      property="twitter:image"
      content="https://blablabook-sigma.vercel.app/book.svg"
    />

    <!-- Favicon and canonical URL -->
    <link rel="shortcut icon" type="image/svg+xml" href="/book.svg?v=1" />
    <link rel="canonical" href="https://blablabook-sigma.vercel.app" />

    <!-- Preload LCP image: hero background loaded before JS executes.-->
    <link
      rel="preload"
      as="image"
      imagesrcset="/hero-bg.webp"
      type="image/webp"
      fetchpriority="high"
    />

    <!-- Preconnect and DNS-prefetch for performance optimization -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="preconnect" href="https://covers.openlibrary.org" crossorigin />
    <link rel="preconnect" href="https://openlibrary.org" crossorigin />
    <link rel="dns-prefetch" href="https://blablabook-sigma.vercel.app" />

    <!-- Google Fonts with async loading using media="print" trick for non-blocking load -->
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap"
      rel="stylesheet"
      media="print"
      onload="this.media = 'all'"
    />
    <!-- Fallback for users with JavaScript disabled -->
    <noscript>
      <link
        href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap"
        rel="stylesheet"
      />
    </noscript>

    <!-- Page title for browser tabs and search results -->
    <title>
      Blablabook - Votre bibliothèque numérique | Découvrez des livres
    </title>
  </head>
  <body>
    <!-- React root element where the app will be mounted -->
    <div id="root"></div>
    <!-- Main application entry point -->
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
